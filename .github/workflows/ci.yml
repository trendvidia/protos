name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      # The module must stay light: a user who imports pxf.BigInt pulls
      # in this module's requirements, and nothing else belongs there.
      - name: requires only google.golang.org/protobuf
        run: |
          reqs="$(go mod edit -json | python3 -c 'import json,sys; print(" ".join(r["Path"] for r in json.load(sys.stdin).get("Require", [])))')"
          echo "requires: $reqs"
          test "$reqs" = "google.golang.org/protobuf"
      # Until protowire bundles these files from here (#1, step 5), its
      # copies still get edited; this fails when the two differ.
      - name: matches protowire main
        run: ./scripts/checkdrift.sh
